# FoodMap discovery areas — server-owned search scopes for "area=<key>".
#
# These are FoodMap SEARCH AREAS: a centre and a radius chosen so the area
# holds that district's restaurants in FoodMap's data. They are NOT
# administrative boundaries and must never be described as such
# ("Khu vực là vùng tìm kiếm của FoodMap, không phải ranh giới hành chính.").
#
# Loaded once at startup (AreaCatalogLoader) and validated; an invalid file
# stops the application. Clients only ever see key, label and order:
# centres and radii stay on the server, and no distance is ever shown for an
# area (it would be a distance from this centre, not from the user).
#
# Fields
#   minimumRestaurants  an area with fewer active restaurants inside its
#                       radius is unavailable: left out of GET /api/v1/catalog
#                       and rejected as area=<key> (re-measured every minute)
#   key                 stable lowercase slug, unique
#   label               Vietnamese display label, unique ("Quanh {label}")
#   order               display order, positive and unique
#   center              {lat, lng} — median of the district's restaurants in
#                       the 2026-10-03 data (Master Specification §8.2)
#   radiusMeters        100..5000; an area never widens beyond it

minimumRestaurants: 15

areas:
  - key: quan-1
    label: Quận 1
    order: 10
    center: { lat: 10.7737, lng: 106.6999 }
    radiusMeters: 2000

  - key: quan-3
    label: Quận 3
